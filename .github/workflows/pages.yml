# Publishes the flasher to GitHub Pages: bundles the pinned libraries into vendor.js and deploys index.html,
# flash.js and vendor.js. No firmware is published: the page flashes a file chosen on the phone.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Bundle the libraries
        run: |
          npm ci --no-audit --no-fund
          npm run build
          mkdir site
          cp index.html flash.js vendor.js site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish
        id: deploy
        uses: actions/deploy-pages@v4
